<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTT Field Logger</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>PTT Field Logger</h1>
    <p class="subtitle">SageWire Gateway voice-field logger</p>

    <section class="card">
      <button id="connectBtn">Connect Headset</button>
      <button id="micTestBtn">Mic Test / Wake Audio</button>
      <button id="manualStartBtn">Start Recording</button>
      <button id="manualStopBtn">Stop Recording</button>

      <div id="connection">Not connected</div>
      <div id="state" class="released">PTT RELEASED</div>
      <div id="timer">00:00.0</div>
      <canvas id="vu" width="320" height="42"></canvas>
    </section>

    <section class="card">
      <h2>Current Session</h2>
      <div id="currentSession">No active session</div>
    </section>

    <section class="card">
      <h2>Session Log</h2>
      <button id="exportBtn">Download JSON Log</button>
      <button id="clearBtn">Clear Log</button>
      <div id="sessionLog">No sessions yet.</div>
    </section>

    <section class="card">
      <h2>Raw Event Log</h2>
      <div id="rawLog"></div>
    </section>
  </main>

  <script src="/app.js?v=1.0.0"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
