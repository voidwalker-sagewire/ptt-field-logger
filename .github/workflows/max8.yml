name: MAX-8 voice and factory baseline
on:
  pull_request:
    paths:
      - 'max8/**'
      - 'server.js'
      - '.github/workflows/max8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --test max8/max8-turn.test.mjs

  waveshare-native-audio-baseline:
    # Reproducibility check only: does NOT overwrite our watch, install
    # vendor firmware, or claim that MAX-8 UI has been integrated.
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the known Waveshare firmware reference
        shell: bash
        run: |
          git clone https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06.git /tmp/waveshare
          cd /tmp/waveshare
          git checkout 30f3b23b3d4bb38d32f7d0cddffb66759668a855
      - name: Compile native ES7210 recorder and MusicPlayer baseline
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C /tmp/waveshare/examples/factory set-target esp32s3
          idf.py -C /tmp/waveshare/examples/factory build
