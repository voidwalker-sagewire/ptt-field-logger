name: MAX-8 native integrated firmware build
on:
  pull_request:
    paths:
      - 'max8/**'
      - 'server.js'
      - '.github/workflows/max8.yml'
  workflow_dispatch:

concurrency:
  group: max8-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  voice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: npm ci --ignore-scripts
      - run: node --test max8/*.test.mjs
      - name: Test native configuration policy and storage errors on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Imax8/tests -Imax8/native max8/native/Max8Config.cpp max8/tests/config_test.cpp -o /tmp/max8-config-test
          /tmp/max8-config-test

  max8-native-integrated:
    # Build an integrated test firmware without ever flashing a physical watch.
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the known Waveshare firmware reference
        shell: bash
        run: |
          git clone https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06.git /tmp/waveshare
          cd /tmp/waveshare
          git checkout 30f3b23b3d4bb38d32f7d0cddffb66759668a855
      - name: Insert MAX-8 native conversation app into pinned factory code
        shell: bash
        run: python max8/native/apply_factory.py /tmp/waveshare/examples/factory max8/native
      - name: Compile integrated MAX-8, native Recorder and MusicPlayer
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C /tmp/waveshare/examples/factory set-target esp32s3
          idf.py -C /tmp/waveshare/examples/factory build
      - name: Save integrated firmware binaries for review only
        uses: actions/upload-artifact@v4
        with:
          name: max8-native-firmware-unvalidated-hardware
          path: |
            /tmp/waveshare/examples/factory/build/bootloader/bootloader.bin
            /tmp/waveshare/examples/factory/build/partition_table/partition-table.bin
            /tmp/waveshare/examples/factory/build/*.bin
          if-no-files-found: error
          retention-days: 7
